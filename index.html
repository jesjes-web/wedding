<!doctype html><html lang="en" data-theme="light" style="color-scheme: light;"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Wedding · May 15, 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Jost,system-ui,sans-serif;color:#3b2f2a;background:#f6efe8;min-height:100vh}
#bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#f3d9d0,#e9e0cf 55%,#cfd8c6) center/cover no-repeat}
#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(30,18,14,.35),rgba(30,18,14,.55))}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
.hero{text-align:center;color:#fff;padding:48px 0 28px}
.hero small{letter-spacing:.3em;text-transform:uppercase;font-size:12px;opacity:.9}
.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-style:italic;font-size:clamp(44px,12vw,78px);margin:12px 0 6px;line-height:1.05}
.hero p{margin:4px 0;font-size:16px;font-weight:300}
.cd{display:flex;gap:10px;justify-content:center;margin:26px 0 8px;flex-wrap:wrap}
.cd div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(6px);border-radius:14px;padding:12px 8px;min-width:74px}
.cd b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:36px;font-weight:500}
.cd span{font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.msg{color:#fff;text-align:center;max-width:520px;margin:18px auto 0;font-weight:300;line-height:1.6}
.card{background:rgba(255,250,245,.94);border-radius:18px;padding:22px;margin-top:20px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.card h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:28px;margin:0 0 10px;color:#7a4b3a}
.card ul{margin:0;padding-left:20px;line-height:1.75}
.row{display:flex;gap:8px}
input,textarea,button{font:inherit}
input,textarea{width:100%;padding:11px 12px;border:1px solid #d8c7ba;border-radius:10px;background:#fff;color:#3b2f2a}
textarea{min-height:110px}
button{border:0;border-radius:10px;padding:11px 16px;background:#8a5642;color:#fff;cursor:pointer;font-weight:500}
button.alt{background:#e8dcd2;color:#5a3d31}
.seat{margin-top:12px;padding:14px;border-radius:12px;background:#f4e6dc;line-height:1.5}
.seat b{font-size:19px;color:#7a4b3a}
.sw{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sw i{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
footer{text-align:center;color:#fff;margin-top:34px;font-weight:300;font-size:14px}
#adminBtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.3)}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fffaf5;z-index:10;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 90px;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
#panel h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;margin:22px 0 8px;color:#7a4b3a}
#panel label{display:block;font-size:13px;margin:10px 0 4px;color:#6b574d}
.g{display:grid;grid-template-columns:1fr 62px 58px 34px;gap:6px;margin-bottom:6px}
.g button{padding:6px}
.bar{position:sticky;bottom:0;background:#fffaf5;padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.hide{display:none}
</style></head><body>
<div id="bg"></div>
<div id="app"></div>
<script type="application/json" id="data">{"couple":"Bride & Groom","date":"2027-05-15","time":"15:00","venue":"Villa Monica, Pateros","welcome":"We are so happy you’re here to celebrate with us. Your presence is the greatest gift. Find your seat below and see what to wear!","bg":"","showSeats":true,"photoLink":"","palette":"#d9a7a0,#c9b79c,#9caf88,#f3ece4","rules":["Please arrive 30 minutes before the ceremony.","Kindly silence your phones during the ceremony.","Our photographers will capture every moment, so please keep phones away during the walk down the aisle.","Please stay in your assigned seat and table.","Enjoy, dance, and have fun!"],"dress":["Semi-formal / formal attire.","Soft earth tones and pastels are welcome (see the colors below).","Please avoid all white, ivory, and cream, which are reserved for the bride.","Comfortable shoes are a good idea, because the garden venue has grass and stone paths."],"guests":[{"name":"Jester Dalde","table":"1","seat":"1"},{"name":"Sample Guest Two","table":"1","seat":"2"},{"name":"Sample Guest Three","table":"2","seat":"1"}]}</script>
<script>
const REPO_OWNER = 'jesjes-web';
const REPO_NAME = 'wedding';

let D=JSON.parse(document.getElementById('data').textContent),W=null,tick=null;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const target=()=>new Date(D.date+'T'+D.time+':00+08:00');
const fmtDate=()=>new Date(D.date+'T12:00:00+08:00').toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric',timeZone:'Asia/Manila'});

function view(){
  $('#bg').style.backgroundImage=D.bg?'url("'+D.bg+'")':'';
  const li=a=>a.map(x=>'<li>'+esc(x)+'</li>').join('');
  const sw=D.palette.split(',').map(c=>c.trim()).filter(Boolean).map(c=>'<i style="background:'+esc(c)+'"></i>').join('');
  $('#app').innerHTML=`<div class="wrap">
   <div class="hero"><small>Together with their families</small><h1>${esc(D.couple)}</h1>
   <p>${esc(fmtDate())}</p><p>${esc(D.venue)}</p>
   <div class="cd" id="cd"></div></div>
   <p class="msg">${esc(D.welcome)}</p>
   <div class="card"><h2>Find your seat</h2>
   ${D.showSeats?`<div class="row"><input id="q" placeholder="Type your name…" autocomplete="off"><button id="go">Search</button></div><div id="res"></div>`:`<p>Seating will be revealed soon. Please check back closer to the day. 💛</p>`}</div>
   <div class="card"><h2>What to wear</h2><ul>${li(D.dress)}</ul><div class="sw">${sw}</div></div>
   <div class="card"><h2>Guest guidelines</h2><ul>${li(D.rules)}</ul></div>
   ${/^https:\/\//.test(D.photoLink||'')?`<div class="card"><h2>Share your photos</h2><p style="margin:0 0 14px;line-height:1.6">Took a great picture at our wedding? We’d love to see it! Tap the button to upload your photos.</p><a href="${esc(D.photoLink)}" target="_blank" rel="noopener" style="display:inline-block;background:#8a5642;color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:500">📷 Upload your photos</a></div>`:`<div class="card"><h2>Share your photos</h2><p style="margin:0;line-height:1.6">Photo sharing opens on our wedding day. Come back then to upload the pictures you take! 📷</p></div>`}
   <footer>With love, ${esc(D.couple)} · ${esc(D.venue)}</footer></div>`;
  clearInterval(tick);tick=setInterval(count,1000);count();
  const q=$('#q');if(q){$('#go').onclick=search;q.onkeydown=e=>{if(e.key==='Enter')search()}}
}
function count(){
  const el=$('#cd');if(!el)return;
  let s=Math.floor((target()-Date.now())/1000);
  if(s<=0){el.innerHTML='<div style="padding:14px 22px"><b style="font-size:26px">'+(s>-86400?'Today is the day! 💍':'Thank you for celebrating with us')+'</b></div>';return}
  const v=[['Days',Math.floor(s/86400)],['Hours',Math.floor(s%86400/3600)],['Minutes',Math.floor(s%3600/60)],['Seconds',s%60]];
  el.innerHTML=v.map(x=>'<div><b>'+x[1]+'</b><span>'+x[0]+'</span></div>').join('');
}
function search(){
  const t=$('#q').value.trim().toLowerCase(),r=$('#res');
  if(t.length<2){r.innerHTML='<div class="seat">Please type at least 2 letters of your name.</div>';return}
  const m=D.guests.filter(g=>g.name.toLowerCase().includes(t));
  r.innerHTML=m.length?m.map(g=>`<div class="seat">Welcome, <b>${esc(g.name)}</b>!<br>You are at Table <b>${esc(g.table)}</b>${g.seat?', Seat <b>'+esc(g.seat)+'</b>':''}.</div>`).join(''):'<div class="seat">We couldn’t find that name. Try your first or last name, or ask one of our ushers for help.</div>';
}

/* ---------- Admin ---------- */
function admin(){
  W=JSON.parse(JSON.stringify(D));
  const p=document.createElement('div');p.id='panel';document.body.appendChild(p);

  p.innerHTML=`
  <div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">Control panel</h3><button class="alt" id="x">Close</button></div>
  <label>Names of the couple</label><input id="a1" value="${esc(W.couple)}">
  <label>Venue</label><input id="a2" value="${esc(W.venue)}">
  <div class="row"><div style="flex:1"><label>Date</label><input id="a3" type="date" value="${esc(W.date)}"></div><div style="flex:1"><label>Ceremony time</label><input id="a4" type="time" value="${esc(W.time)}"></div></div>
  <label>Welcome message</label><textarea id="a5">${esc(W.welcome)}</textarea>
  <label><input type="checkbox" id="a6" style="width:auto" ${W.showSeats?'checked':''}> Show seat lookup to guests</label>
  <h3>Prenup photo background</h3>
  <label>Background image URL or relative file name</label><input id="a7" value="${esc(W.bg)}" placeholder="prenup.jpg">
  <h3>Guests &amp; seats</h3>
  <div id="gl"></div>
  <button class="alt" id="add" style="margin-top:6px">+ Add guest</button>
  <label style="margin-top:14px">Or paste many (one per line: Name, Table, Seat — or paste from Excel):</label>
  <textarea id="bulk" placeholder="Maria Santos, 3, 4&#10;Juan Dela Cruz	3	5"></textarea>
  <button class="alt" id="imp" style="margin-top:6px">Import lines</button>
  <h3>Dress code (one per line)</h3><textarea id="b1">${esc(W.dress.join('\n'))}</textarea>
  <label>Color palette (hex codes, comma separated)</label><input id="b2" value="${esc(W.palette)}">
  <h3>Rules (one per line)</h3><textarea id="b3">${esc(W.rules.join('\n'))}</textarea>
  <h3>Guest photo upload</h3><label>Link to your shared album (must start with https://)</label><input id="b4" value="${esc(W.photoLink)}" placeholder="https://photos.app.goo.gl/...">
  
  <h3>Auto-Sync to GitHub</h3>
  <label>GitHub Personal Access Token (PAT)</label>
  <input type="password" id="ghToken" value="${localStorage.getItem('gh_token')||''}" placeholder="ghp_xxxxxxxxxxxx">
  <small style="color:#777;display:block;margin-bottom:10px">Saved in your browser private storage.</small>

  <div class="bar">
    <button id="cloudSave" style="background:#2e7d32">🚀 Save Directly to Web</button>
    <button id="save" class="alt">💾 Download File</button>
    <div id="st" style="font-size:13px;width:100%;margin-top:6px;font-weight:500"></div>
  </div>`;

  const renderGuestList = () => {
    const gl = $('#gl');
    gl.innerHTML = W.guests.map((g, i) => `
      <div class="g" data-row="${i}">
        <input class="g-name" value="${esc(g.name)}" placeholder="Name">
        <input class="g-table" value="${esc(g.table)}" placeholder="Table">
        <input class="g-seat" value="${esc(g.seat)}" placeholder="Seat">
        <button class="alt del-btn" data-del="${i}">✕</button>
      </div>
    `).join('');
  };

  const syncCurrentRows = () => {
    const rows = p.querySelectorAll('.g');
    const updated = [];
    rows.forEach(r => {
      const name = r.querySelector('.g-name').value;
      const table = r.querySelector('.g-table').value;
      const seat = r.querySelector('.g-seat').value;
      updated.push({ name, table, seat });
    });
    W.guests = updated;
  };

  const grab = () => {
    syncCurrentRows();
    W.couple = $('#a1').value;
    W.venue = $('#a2').value;
    W.date = $('#a3').value || W.date;
    W.time = $('#a4').value || W.time;
    W.welcome = $('#a5').value;
    W.showSeats = $('#a6').checked;
    W.dress = $('#b1').value.split('\n').map(s=>s.trim()).filter(Boolean);
    W.palette = $('#b2').value;
    W.photoLink = $('#b4').value.trim();
    W.bg = $('#a7').value.trim();
    W.rules = $('#b3').value.split('\n').map(s=>s.trim()).filter(Boolean);
  };

  // Delegate delete clicks
  $('#gl').addEventListener('click', e => {
    if (e.target.classList.contains('del-btn')) {
      syncCurrentRows();
      const idx = parseInt(e.target.dataset.del, 10);
      W.guests.splice(idx, 1);
      renderGuestList();
    }
  });

  // Add empty row
  $('#add').onclick = () => {
    syncCurrentRows();
    W.guests.push({ name: '', table: '', seat: '' });
    renderGuestList();
    const allNames = p.querySelectorAll('.g-name');
    if (allNames.length) allNames[allNames.length - 1].focus();
  };

  // Import lines (handles commas and tabs from Excel)
  $('#imp').onclick = () => {
    syncCurrentRows();
    const lines = $('#bulk').value.split('\n');
    let addedCount = 0;
    lines.forEach(l => {
      const text = l.trim();
      if (!text) return;
      // Split by tab (if copied from Excel) or comma
      const parts = text.includes('\t') ? text.split('\t') : text.split(',');
      const clean = parts.map(s => s.trim());
      if (clean[0]) {
        W.guests.push({
          name: clean[0],
          table: clean[1] || '',
          seat: clean[2] || ''
        });
        addedCount++;
      }
    });
    $('#bulk').value = '';
    renderGuestList();
    const st = $('#st');
    st.style.color = '#1976d2';
    st.textContent = `Imported ${addedCount} guest(s). Scroll up to review!`;
  };

  $('#x').onclick = () => p.remove();

  const getNewHtml = () => {
    grab();
    W.guests = W.guests.filter(g => g.name.trim());
    const json = JSON.stringify(W).replace(/</g, '\\u003c');
    const fullHtml = '<!doctype html>' + document.documentElement.outerHTML;
    return fullHtml.replace(/(<script type="application\/json" id="data">)[\s\S]*?<\/script>/, (m, s) => s + json + '<\/script>');
  };

  // GitHub Auto-Save
  $('#cloudSave').onclick = async () => {
    const token = $('#ghToken').value.trim();
    const status = $('#st');
    if (!token) {
      status.style.color = '#d32f2f';
      status.textContent = 'Please paste your GitHub Personal Access Token above.';
      return;
    }
    localStorage.setItem('gh_token', token);
    status.style.color = '#1976d2';
    status.textContent = 'Saving directly to GitHub...';

    try {
      const fileUrl = `https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/index.html`;
      const resGet = await fetch(fileUrl, { headers: { 'Authorization': `Bearer ${token}` } });
      if (!resGet.ok) throw new Error('Could not find file on GitHub. Check your token.');
      const fileData = await resGet.json();

      const newContent = getNewHtml();
      const base64Content = btoa(unescape(encodeURIComponent(newContent)));

      const resPut = await fetch(fileUrl, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'Update wedding details and guests via admin panel',
          content: base64Content,
          sha: fileData.sha
        })
      });

      if (!resPut.ok) throw new Error('GitHub rejected update. Check permissions.');
      status.style.color = '#2e7d32';
      status.textContent = '✅ Saved to GitHub! Your site will update in 60 seconds.';
      D = JSON.parse(JSON.stringify(W));
      view();
    } catch (err) {
      status.style.color = '#d32f2f';
      status.textContent = '❌ ' + err.message;
    }
  };

  // Manual Backup Download
  $('#save').onclick = () => {
    const out = getNewHtml();
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], { type: 'text/html' }));
    a.download = 'index.html';
    a.click();
    $('#st').style.color = '#333';
    $('#st').textContent = 'Downloaded backup index.html.';
  };

  renderGuestList();
}

view();
(()=>{try{if(location.hash==='#admin'){
  const b=document.createElement('button');b.id='adminBtn';b.textContent='⚙ Admin panel';b
