<!doctype html>
<html lang="en" data-theme="light" style="color-scheme: light;"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Our Wedding · May 15, 2027</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;font-family:Jost,system-ui,sans-serif;color:#3b2f2a;background:#f6efe8;min-height:100vh}
#bg{position:fixed;inset:0;z-index:-1;background:linear-gradient(160deg,#f3d9d0,#e9e0cf 55%,#cfd8c6) center/cover no-repeat}
#bg:after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(30,18,14,.35),rgba(30,18,14,.55))}
.wrap{max-width:720px;margin:0 auto;padding:28px 18px 60px}
.hero{text-align:center;color:#fff;padding:48px 0 28px}
.hero small{letter-spacing:.3em;text-transform:uppercase;font-size:12px;opacity:.9}
.hero h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-style:italic;font-size:clamp(44px,12vw,78px);margin:12px 0 6px;line-height:1.05}
.hero p{margin:4px 0;font-size:16px;font-weight:300}
.cd{display:flex;gap:10px;justify-content:center;margin:26px 0 8px;flex-wrap:wrap}
.cd div{background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.4);backdrop-filter:blur(6px);border-radius:14px;padding:12px 8px;min-width:74px}
.cd b{display:block;font-family:"Cormorant Garamond",Georgia,serif;font-size:36px;font-weight:500}
.cd span{font-size:11px;letter-spacing:.18em;text-transform:uppercase}
.msg{color:#fff;text-align:center;max-width:520px;margin:18px auto 0;font-weight:300;line-height:1.6}
.card{background:rgba(255,250,245,.94);border-radius:18px;padding:22px;margin-top:20px;box-shadow:0 8px 30px rgba(0,0,0,.18)}
.card h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:500;font-size:28px;margin:0 0 10px;color:#7a4b3a}
.card ul{margin:0;padding-left:20px;line-height:1.75}
.row{display:flex;gap:8px}
.stack{display:flex;flex-direction:column;gap:10px}
input,textarea,select,button{font:inherit}
input,textarea,select{width:100%;padding:11px 12px;border:1px solid #d8c7ba;border-radius:10px;background:#fff;color:#3b2f2a}
textarea{min-height:90px}
button{border:0;border-radius:10px;padding:11px 16px;background:#8a5642;color:#fff;cursor:pointer;font-weight:500;transition:opacity .2s}
button:disabled{opacity:.6;cursor:not-allowed}
button.alt{background:#e8dcd2;color:#5a3d31}
.seat{margin-top:12px;padding:14px;border-radius:12px;background:#f4e6dc;line-height:1.5}
.seat b{font-size:19px;color:#7a4b3a}
.sw{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.sw i{width:34px;height:34px;border-radius:50%;border:2px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.3)}
footer{text-align:center;color:#fff;margin-top:34px;font-weight:300;font-size:14px}
#adminBtn{position:fixed;right:14px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:5;box-shadow:0 4px 14px rgba(0,0,0,.3);background:#2e7d32}
#panel{position:fixed;top:0;right:0;bottom:0;width:min(460px,100%);background:#fffaf5;z-index:30;overflow:auto;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 90px;box-shadow:-8px 0 30px rgba(0,0,0,.3)}
#panel h3{font-family:"Cormorant Garamond",Georgia,serif;font-size:24px;margin:22px 0 8px;color:#7a4b3a}
#panel label{display:block;font-size:13px;margin:10px 0 4px;color:#6b574d}
.g{display:grid;grid-template-columns:1fr 62px 58px 34px;gap:6px;margin-bottom:6px}
.g button{padding:6px}
.bar{position:sticky;bottom:0;background:#fffaf5;padding:10px 0;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ===== Envelope opening intro ===== */
#intro{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(24px,5vh,44px);padding:calc(24px + env(safe-area-inset-top,0px)) 20px calc(24px + env(safe-area-inset-bottom,0px));background:radial-gradient(120% 90% at 50% 28%,#f6efe8 0%,#e4e9ee 55%,#cddbe7 100%);color:#3b2f2a;touch-action:none;overscroll-behavior:contain;overflow:hidden;transition:opacity 1s ease,transform 1.2s cubic-bezier(.22,1,.36,1),visibility 0s linear 1s}
#intro.leave{opacity:0;transform:scale(1.08);pointer-events:none;visibility:hidden}
.in-top{margin:0;text-align:center;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(24px,6.5vw,32px);color:#6c4a3c;transition:opacity .5s ease,transform .8s ease}
.in-hint{margin:0;text-align:center;font-size:14px;letter-spacing:.04em;color:#6b574d;transition:opacity .5s ease}
#intro.open .in-top,#intro.open .in-hint{opacity:0}
#intro.open .in-top{transform:translateY(-10px)}

.env-stage{position:relative;width:min(86vw,440px);aspect-ratio:1.45/1;transition:transform 1s cubic-bezier(.22,1,.36,1)}
#intro.open .env-stage{transform:translateY(12%)}
.env{position:absolute;inset:0;cursor:pointer;transition:transform .5s ease}
@media (hover:hover){#intro:not(.open) .env:hover{transform:translateY(-5px)}}
.env>*{position:absolute;inset:0}
.env-back{border-radius:8px;background:linear-gradient(165deg,#86aecb,#6f98b8);box-shadow:0 26px 50px -16px rgba(40,62,82,.45),0 8px 18px -8px rgba(40,62,82,.3)}

.env-card{inset:auto;left:6%;right:6%;top:7%;bottom:7%;z-index:3;background:#fffaf5;border-radius:6px;box-shadow:0 3px 14px rgba(40,62,82,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:12px;transition:transform 1.1s cubic-bezier(.34,1.3,.64,1) .85s}
#intro.open .env-card{transform:translateY(-50%)}
#intro.leave .env-card{transition:transform 1s ease;transform:translateY(-50%) scale(1.5)}
.env-card .c-small{font-size:12px;letter-spacing:.04em;color:#8a6a5a;font-weight:400}
.env-card .c-names{font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(30px,9vw,46px);line-height:1.05;color:#7a4b3a;margin:6px 0}
.env-card .c-rule{width:48px;height:1px;background:#d8c7ba;margin:4px 0 8px}
.env-card .c-date{font-size:13px;font-weight:300;color:#5a4a42;line-height:1.5}

.env-l,.env-r,.env-b{pointer-events:none}
.env-l{z-index:4;background:linear-gradient(90deg,#9dbdd5,#aac7dc);clip-path:polygon(0 0,52% 52%,0 100%);border-radius:8px 0 0 8px}
.env-r{z-index:4;background:linear-gradient(270deg,#9dbdd5,#aac7dc);clip-path:polygon(100% 0,48% 52%,100% 100%);border-radius:0 8px 8px 0}
.env-b{z-index:5;background:linear-gradient(0deg,#a8c6dc,#bdd3e4);clip-path:polygon(0 100%,50% 45%,100% 100%);border-radius:0 0 8px 8px}
.env-trim{z-index:6;width:100%;height:100%;pointer-events:none}

.env-flap{inset:0 0 auto 0;height:58%;z-index:7;background:linear-gradient(180deg,#b3cde0,#8fb2cf);clip-path:polygon(0 0,100% 0,50% 100%);border-radius:8px 8px 0 0;transform-origin:50% 0;transform:perspective(900px) rotateX(0deg);transition:transform .9s cubic-bezier(.4,0,.2,1) .15s,z-index 0s linear .55s}
#intro.open .env-flap{transform:perspective(900px) rotateX(180deg);z-index:2}

.env-seal{inset:auto;left:50%;top:58%;z-index:10;width:clamp(58px,17vw,76px);aspect-ratio:1;padding:0;border:0;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle at 35% 30%,#b57a63,#8a5642 55%,#5e3727);box-shadow:0 8px 14px rgba(40,22,14,.4),inset 0 0 0 3px rgba(255,255,255,.12),inset 0 -3px 6px rgba(0,0,0,.25);color:#f6e9dc;font-family:"Cormorant Garamond",Georgia,serif;font-style:italic;font-weight:500;font-size:clamp(17px,5vw,22px);letter-spacing:.02em;transition:transform .5s cubic-bezier(.34,1.56,.64,1),opacity .4s ease}
.env-seal:before{content:"";position:absolute;inset:0;border-radius:50%;animation:sealRing 2.6s ease-out infinite}
.env-seal:after{content:"";position:absolute;inset:7px;border-radius:50%;border:1px solid rgba(246,233,220,.45)}
.env-seal:focus-visible{outline:2px solid #3b2f2a;outline-offset:4px}
@media (hover:hover){#intro:not(.open) .env:hover .env-seal{transform:translate(-50%,-50%) scale(1.07)}}
#intro.open .env-seal{transform:translate(-50%,-90%) scale(.7);opacity:0;pointer-events:none}
#intro.open .env-seal:before{animation:none}
@keyframes sealRing{0%{box-shadow:0 0 0 0 rgba(138,86,66,.45)}100%{box-shadow:0 0 0 18px rgba(138,86,66,0)}}

.spark{position:absolute;left:50%;top:58%;z-index:11;width:6px;height:6px;border-radius:50%;pointer-events:none;animation:burst .9s ease-out forwards}
@keyframes burst{0%{transform:translate(-50%,-50%) scale(.4);opacity:1}100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1);opacity:0}}

@media (prefers-reduced-motion:reduce){
  #intro,#intro *{transition-duration:.01s!important;transition-delay:0s!important;animation:none!important}
}
</style>
</head>
<body>
<div id="bg" style="background-image: url(&quot;sample.png&quot;);"></div>
<div id="app"></div>
<script type="application/json" id="data">
{
  "couple": "Jes & Charm",
  "date": "2027-05-15",
  "time": "15:00",
  "venue": "Villa Monica, Pateros",
  "welcome": "We are so happy you’re here to celebrate with us. Your presence is the greatest gift. Please confirm your attendance below!",
  "bg": "sample.png",
  "showRsvp": true,
  "rsvpUrl": "PASTE_YOUR_GOOGLE_APPS_SCRIPT_URL_HERE",
  "showSeats": true,
  "photoLink": "https://drive.google.com/drive/folders/1AOLYFy9G6b-ERUM_l-J2S3yeIk3iRhru?usp=sharing",
  "palette": "#7caad0,#a8c5db,#e8edf3,#dfd3c3",
  "rules": [
    "Please arrive 30 minutes before the ceremony.",
    "Kindly silence your phones during the ceremony.",
    "Our photographers will capture every moment, so please keep phones away during the walk down the aisle.",
    "Please stay in your assigned seat and table.",
    "Enjoy, dance, and have fun!"
  ],
  "dress": [
    "Semi-formal / formal attire.",
    "Soft earth tones and pastels are welcome (see the colors below).",
    "Please avoid all white, ivory, and cream, which are reserved for the bride.",
    "Comfortable shoes are a good idea, because the garden venue has grass and stone paths."
  ],
  "guests": []
}
</script>
<script>
var REPO_OWNER = 'jesjes-web';
var REPO_NAME = 'wedding';
var TARGET_FILE = 'index.html';
var ADMIN_PASSWORD = 'yourWeddingPassword123';

var D = JSON.parse(document.getElementById('data').textContent);
var W = null;
var tick = null;

function $(s) { return document.querySelector(s); }
function esc(s) {
  return String(s || '').replace(/[&<>"']/g, function(c) {
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function target() { return new Date(D.date + 'T' + D.time + ':00+08:00'); }
function fmtDate() {
  return new Date(D.date + 'T12:00:00+08:00').toLocaleDateString('en-US', {
    weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'Asia/Manila'
  });
}

function view() {
  $('#bg').style.backgroundImage = D.bg ? 'url("' + D.bg + '")' : '';
  var li = function(arr) {
    return arr.map(function(x) { return '<li>' + esc(x) + '</li>'; }).join('');
  };
  var sw = D.palette.split(',').map(function(c) { return c.trim(); }).filter(Boolean).map(function(c) {
    return '<i style="background:' + esc(c) + '"></i>';
  }).join('');

  var rsvpSec = '';
  if (D.showRsvp) {
    rsvpSec = '<div class="card"><h2>RSVP &amp; Guest Details</h2>' +
      '<p style="margin:0 0 14px;line-height:1.5;font-size:15px">Kindly let us know if you can make it and leave your contact details so we can keep you updated.</p>' +
      '<form id="rsvpForm" class="stack">' +
        '<input id="rName" placeholder="Full Name *" required>' +
        '<div class="row">' +
          '<select id="rAttending" style="flex:2" required>' +
            '<option value="Yes, I will be there!">Yes, I will be there!</option>' +
            '<option value="Sorry, I cannot attend">Sorry, I cannot attend</option>' +
          '</select>' +
          '<input id="rGuests" type="number" min="1" max="10" value="1" placeholder="Guests" title="Number of guests" style="flex:1">' +
        '</div>' +
        '<input id="rContact" placeholder="Mobile Number or Email *" required>' +
        '<textarea id="rNotes" placeholder="Dietary restrictions or a sweet note for the couple (optional)" style="min-height:72px"></textarea>' +
        '<button type="submit" id="rSubmit">Confirm RSVP</button>' +
      '</form>' +
      '<div id="rStatus"></div></div>';
  }

  var photoSec = /^https:\/\//.test(D.photoLink || '')
    ? '<div class="card"><h2>Share your photos</h2><p style="margin:0 0 14px;line-height:1.6">Took a great picture at our wedding? We’d love to see it! Tap the button to upload your photos.</p><a href="' + esc(D.photoLink) + '" target="_blank" rel="noopener" style="display:inline-block;background:#8a5642;color:#fff;text-decoration:none;padding:12px 20px;border-radius:10px;font-weight:500">📷 Upload your photos</a></div>'
    : '<div class="card"><h2>Share your photos</h2><p style="margin:0;line-height:1.6">Photo sharing opens on our wedding day. Come back then to upload the pictures you take! 📷</p></div>';

  $('#app').innerHTML = '<div class="wrap">' +
    '<div class="hero"><small>Together with their families</small><h1>' + esc(D.couple) + '</h1>' +
    '<p>' + esc(fmtDate()) + '</p><p>' + esc(D.venue) + '</p>' +
    '<div class="cd" id="cd"></div></div>' +
    '<p class="msg">' + esc(D.welcome) + '</p>' +
    rsvpSec +
    '<div class="card"><h2>Find your seat</h2>' +
    (D.showSeats ? '<div class="row"><input id="q" placeholder="Type your name…" autocomplete="off"><button id="go">Search</button></div><div id="res"></div>' : '<p>Seating will be revealed soon. Please check back closer to the day. 💛</p>') +
    '</div>' +
    '<div class="card"><h2>What to wear</h2><ul>' + li(D.dress) + '</ul><div class="sw">' + sw + '</div></div>' +
    '<div class="card"><h2>Guest guidelines</h2><ul>' + li(D.rules) + '</ul></div>' +
    photoSec +
    '<footer>With love, ' + esc(D.couple) + ' · ' + esc(D.venue) + '</footer></div>';

  clearInterval(tick);
  tick = setInterval(count, 1000);
  count();

  var q = $('#q');
  if (q) {
    $('#go').onclick = search;
    q.onkeydown = function(e) { if (e.key === 'Enter') search(); };
  }

  var rForm = $('#rsvpForm');
  if (rForm) {
    rForm.onsubmit = async function(e) {
      e.preventDefault();
      var st = $('#rStatus');
      var btn = $('#rSubmit');

      if (!D.rsvpUrl || D.rsvpUrl.indexOf('https://script.google.com') !== 0) {
        st.innerHTML = '<div class="seat" style="background:#fdecea;color:#a33">RSVP endpoint is not configured yet. Please add your Google Apps Script URL in the Admin Panel.</div>';
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';
      st.innerHTML = '';

      var payload = {
        name: $('#rName').value.trim(),
        attending: $('#rAttending').value,
        guests: $('#rGuests').value,
        contact: $('#rContact').value.trim(),
        notes: $('#rNotes').value.trim()
      };

      try {
        await fetch(D.rsvpUrl, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify(payload)
        });
        st.innerHTML = '<div class="seat">Thank you, <b>' + esc(payload.name) + '</b>! Your response has been recorded. 💛</div>';
        rForm.reset();
      } catch (err) {
        st.innerHTML = '<div class="seat" style="background:#fdecea;color:#a33">Something went wrong while sending. Please check your connection and try again.</div>';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Confirm RSVP';
      }
    };
  }
}

function count() {
  var el = $('#cd');
  if (!el) return;
  var s = Math.floor((target() - Date.now()) / 1000);
  if (s <= 0) {
    el.innerHTML = '<div style="padding:14px 22px"><b style="font-size:26px">' + (s > -86400 ? 'Today is the day! 💍' : 'Thank you for celebrating with us') + '</b></div>';
    return;
  }
  var v = [
    ['Days', Math.floor(s / 86400)],
    ['Hours', Math.floor((s % 86400) / 3600)],
    ['Minutes', Math.floor((s % 3600) / 60)],
    ['Seconds', s % 60]
  ];
  el.innerHTML = v.map(function(x) {
    return '<div><b>' + x[1] + '</b><span>' + x[0] + '</span></div>';
  }).join('');
}

function search() {
  var t = $('#q').value.trim().toLowerCase(), r = $('#res');
  if (t.length < 2) {
    r.innerHTML = '<div class="seat">Please type at least 2 letters of your name.</div>';
    return;
  }
  var m = D.guests.filter(function(g) { return g.name.toLowerCase().indexOf(t) !== -1; });
  r.innerHTML = m.length
    ? m.map(function(g) { return '<div class="seat">Welcome, <b>' + esc(g.name) + '</b>!<br>You are at Table <b>' + esc(g.table) + '</b>' + (g.seat ? ', Seat <b>' + esc(g.seat) + '</b>' : '') + '.</div>'; }).join('')
    : '<div class="seat">We couldn’t find that name. Try your first or last name, or ask one of our ushers for help.</div>';
}

function admin() {
  if ($('#panel')) return;
  W = JSON.parse(JSON.stringify(D));
  var p = document.createElement('div');
  p.id = 'panel';
  document.body.appendChild(p);

  var hasToken = !!localStorage.getItem('gh_token');

  p.innerHTML = '<div class="row" style="justify-content:space-between;align-items:center"><h3 style="margin:0">Control panel</h3><button class="alt" id="x">Close</button></div>' +
    '<div class="bar" style="top:0;position:sticky;z-index:2;background:#fffaf5;border-bottom:1px solid #e0d0c0;padding-bottom:10px">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;width:100%">' +
    '<small style="color:' + (hasToken ? '#2e7d32' : '#d32f2f') + ';font-weight:600">' + (hasToken ? '● Token Linked in Browser' : '○ No Token Set') + '</small>' +
    '<button class="alt" id="setTokenBtn" style="padding:4px 8px;font-size:11px">' + (hasToken ? 'Update Token' : 'Set Token') + '</button></div>' +
    '<button id="cloudSave" style="background:#2e7d32;width:100%">🚀 Save Directly to Web</button>' +
    '<div id="st" style="font-size:13px;width:100%;margin-top:6px;font-weight:500"></div></div>' +
    '<label>Names of the couple</label><input id="a1" value="' + esc(W.couple) + '">' +
    '<label>Venue</label><input id="a2" value="' + esc(W.venue) + '">' +
    '<div class="row"><div style="flex:1"><label>Date</label><input id="a3" type="date" value="' + esc(W.date) + '"></div>' +
    '<div style="flex:1"><label>Ceremony time</label><input id="a4" type="time" value="' + esc(W.time) + '"></div></div>' +
    '<label>Welcome message</label><textarea id="a5">' + esc(W.welcome) + '</textarea>' +
    '<h3>RSVP (Google Sheets)</h3>' +
    '<label><input type="checkbox" id="rShow" style="width:auto" ' + (W.showRsvp ? 'checked' : '') + '> Show RSVP form to guests</label>' +
    '<label>Google Apps Script Web App URL</label><input id="rUrl" value="' + esc(W.rsvpUrl || '') + '" placeholder="https://script.google.com/macros/s/.../exec">' +
    '<h3>Seating chart</h3>' +
    '<label><input type="checkbox" id="a6" style="width:auto" ' + (W.showSeats ? 'checked' : '') + '> Show seat lookup to guests</label>' +
    '<div id="gl" style="margin-top:8px"></div>' +
    '<button class="alt" id="add" style="margin-top:6px">+ Add guest</button>' +
    '<label style="margin-top:14px">Or paste many (one per line: Name, Table, Seat — or paste from Google Sheets/Excel):</label>' +
    '<textarea id="bulk" placeholder="Maria Santos, 3, 4"></textarea>' +
    '<button class="alt" id="imp" style="margin-top:6px">Import lines</button>' +
    '<h3>Prenup photo background</h3>' +
    '<label>Background image URL or file name</label><input id="a7" value="' + esc(W.bg) + '" placeholder="prenup.jpg">' +
    '<h3>Dress code (one per line)</h3><textarea id="b1">' + esc(W.dress.join('\n')) + '</textarea>' +
    '<label>Color palette (hex codes, comma separated)</label><input id="b2" value="' + esc(W.palette) + '">' +
    '<h3>Rules (one per line)</h3><textarea id="b3">' + esc(W.rules.join('\n')) + '</textarea>' +
    '<h3>Guest photo upload</h3><label>Link to shared album (must start with https://)</label><input id="b4" value="' + esc(W.photoLink) + '" placeholder="https://photos.app.goo.gl/...">' +
    '<div style="margin-top:20px"><button id="save" class="alt" style="width:100%">💾 Download Backup File</button></div>';

  $('#setTokenBtn').onclick = function() {
    var cur = localStorage.getItem('gh_token') || '';
    var input = prompt('Paste your GitHub Personal Access Token (starts with ghp_):', cur);
    if (input !== null) {
      input = input.trim();
      if (input) {
        localStorage.setItem('gh_token', input);
        adminClose();
        admin();
      }
    }
  };

  function renderGuestList() {
    var gl = $('#gl');
    gl.innerHTML = W.guests.map(function(g, i) {
      return '<div class="g">' +
        '<input class="g-name" value="' + esc(g.name) + '" placeholder="Name">' +
        '<input class="g-table" value="' + esc(g.table) + '" placeholder="Table">' +
        '<input class="g-seat" value="' + esc(g.seat) + '" placeholder="Seat">' +
        '<button class="alt del-btn" data-del="' + i + '">✕</button></div>';
    }).join('');
  }

  function syncRows() {
    var rows = p.querySelectorAll('.g');
    var updated = [];
    rows.forEach(function(r) {
      updated.push({
        name: r.querySelector('.g-name').value,
        table: r.querySelector('.g-table').value,
        seat: r.querySelector('.g-seat').value
      });
    });
    W.guests = updated;
  }

  function grab() {
    syncRows();
    W.couple = $('#a1').value;
    W.venue = $('#a2').value;
    W.date = $('#a3').value || W.date;
    W.time = $('#a4').value || W.time;
    W.welcome = $('#a5').value;
    W.showRsvp = $('#rShow').checked;
    W.rsvpUrl = $('#rUrl').value.trim();
    W.showSeats = $('#a6').checked;
    W.dress = $('#b1').value.split('\n').map(function(s) { return s.trim(); }).filter(Boolean);
    W.palette = $('#b2').value;
    W.photoLink = $('#b4').value.trim();
    W.bg = $('#a7').value.trim();
    W.rules = $('#b3').value.split('\n').map(function(s) { return s.trim(); }).filter(Boolean);
  }

  $('#gl').addEventListener('click', function(e) {
    if (e.target.classList.contains('del-btn')) {
      syncRows();
      var idx = parseInt(e.target.getAttribute('data-del'), 10);
      W.guests.splice(idx, 1);
      renderGuestList();
    }
  });

  $('#add').onclick = function() {
    syncRows();
    W.guests.push({ name: '', table: '', seat: '' });
    renderGuestList();
    var all = p.querySelectorAll('.g-name');
    if (all.length) all[all.length - 1].focus();
  };

  $('#imp').onclick = function() {
    syncRows();
    var lines = $('#bulk').value.split('\n');
    var countAdded = 0;
    lines.forEach(function(l) {
      var t = l.trim();
      if (!t) return;
      var parts = t.indexOf('\t') !== -1 ? t.split('\t') : t.split(',');
      var clean = parts.map(function(s) { return s.trim(); });
      if (clean[0]) {
        W.guests.push({ name: clean[0], table: clean[1] || '', seat: clean[2] || '' });
        countAdded++;
      }
    });
    $('#bulk').value = '';
    renderGuestList();
    $('#st').style.color = '#1976d2';
    $('#st').textContent = 'Imported ' + countAdded + ' guest(s). Scroll up to check!';
  };

  function adminClose() { if (p) p.remove(); }
  $('#x').onclick = adminClose;

  function buildFullHtml() {
    grab();
    W.guests = W.guests.filter(function(g) { return g.name.trim(); });
    var jsonStr = JSON.stringify(W, null, 2).replace(/</g, '\\u003c');
    
    // Temporarily strip dynamic UI elements so the saved HTML stays clean
    var wasOpen = !!$('#panel');
    if (wasOpen) p.remove();
    var introEl = $('#intro');
    if (introEl) introEl.remove();
    var btnEl = $('#adminBtn');
    if (btnEl) btnEl.remove();
    var appEl = $('#app');
    var appHtml = appEl ? appEl.innerHTML : '';
    if (appEl) appEl.innerHTML = '';

    var full = '<!doctype html>\n' + document.documentElement.outerHTML;

    // Restore DOM elements
    if (appEl) appEl.innerHTML = appHtml;
    if (introEl) document.body.appendChild(introEl);
    if (btnEl) document.body.appendChild(btnEl);
    if (wasOpen) document.body.appendChild(p);

    return full.replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/, function(match, start, end) {
      return start + '\n' + jsonStr + '\n' + end;
    });
  }

  $('#cloudSave').onclick = async function() {
    var token = (localStorage.getItem('gh_token') || '').trim();
    var st = $('#st');
    if (!token) {
      st.style.color = '#d32f2f';
      st.textContent = 'Click "Set Token" above to link your GitHub token first.';
      return;
    }
    st.style.color = '#1976d2';
    st.textContent = 'Saving directly to GitHub...';

    try {
      var repoRes = await fetch('https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME, {
        headers: {
          'Authorization': 'token ' + token,
          'Accept': 'application/vnd.github.v3+json'
        }
      });
      if (!repoRes.ok) throw new Error('Repository access error (' + repoRes.status + ')');
      var repoData = await repoRes.json();
      var defaultBranch = repoData.default_branch || 'main';

      var fileUrl = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + TARGET_FILE + '?ref=' + defaultBranch + '&_t=' + Date.now();
      var fileRes = await fetch(fileUrl, {
        headers: {
          'Authorization': 'token ' + token,
          'Accept': 'application/vnd.github.v3+json'
        }
      });
      if (!fileRes.ok) throw new Error('File lookup failed (' + fileRes.status + ')');
      var fileJson = await fileRes.json();

      var updatedHtml = buildFullHtml();
      var bytes = new TextEncoder().encode(updatedHtml);
      var binary = '';
      for (var i = 0; i < bytes.length; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      var b64 = btoa(binary);

      var putUrl = 'https://api.github.com/repos/' + REPO_OWNER + '/' + REPO_NAME + '/contents/' + TARGET_FILE;
      var putRes = await fetch(putUrl, {
        method: 'PUT',
        headers: {
          'Authorization': 'token ' + token,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: 'Update wedding guest list and site details',
          content: b64,
          sha: fileJson.sha,
          branch: defaultBranch
        })
      });

      if (!putRes.ok) {
        var pErr = await putRes.json();
        throw new Error(pErr.message || 'Save rejected');
      }

      st.style.color = '#2e7d32';
      st.textContent = '✅ Saved! Changes live in ~60 seconds.';
      D = JSON.parse(JSON.stringify(W));
      view();
    } catch (err) {
      st.style.color = '#d32f2f';
      st.textContent = '❌ ' + err.message;
    }
  };

  $('#save').onclick = function() {
    var out = buildFullHtml();
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([out], { type: 'text/html' }));
    a.download = 'index.html';
    a.click();
    $('#st').style.color = '#333';
    $('#st').textContent = 'Downloaded backup index.html.';
  };

  renderGuestList();
}

view();

(function() {
  function checkAdmin() {
    if (location.hash === '#admin') {
      if ($('#adminBtn')) return;
      var b = document.createElement('button');
      b.id = 'adminBtn';
      b.textContent = '⚙ Admin panel';
      b.onclick = function() {
        if ($('#panel') || $('#gate')) return;
        var g = document.createElement('div');
        g.id = 'gate';
        g.style.cssText = 'position:fixed;inset:0;z-index:40;background:rgba(30,18,14,.7);display:flex;align-items:center;justify-content:center;padding:20px';
        g.innerHTML = '<div class="card" style="max-width:340px;width:100%;margin:0"><h2>Admin password</h2>' +
          '<input id="pw" type="password" placeholder="Enter password" autocomplete="off">' +
          '<div id="pe" style="color:#a33;font-size:13px;min-height:20px;margin:6px 0"></div>' +
          '<div class="row"><button id="pok">Unlock</button><button class="alt" id="pno">Cancel</button></div></div>';
        document.body.appendChild(g);

        var pw = g.querySelector('#pw');
        var go = function() {
          if (pw.value === ADMIN_PASSWORD) {
            g.remove();
            admin();
          } else {
            g.querySelector('#pe').textContent = 'Wrong password. Please try again.';
          }
        };

        g.querySelector('#pok').onclick = go;
        g.querySelector('#pno').onclick = function() { g.remove(); };
        pw.onkeydown = function(e) { if (e.key === 'Enter') go(); };
        pw.focus();
      };
      document.body.appendChild(b);
    } else {
      var existingBtn = $('#adminBtn');
      if (existingBtn) existingBtn.remove();
    }
  }

  window.addEventListener('hashchange', checkAdmin);
  checkAdmin();
})();

(function() {
  if (location.hash === '#admin') return;

  var parts = String(D.couple || '').split(/\s*(?:&|\band\b)\s*/i);
  var mono = parts.map(function(s) { return s.trim().charAt(0).toUpperCase(); })
                  .filter(Boolean).slice(0, 2).join('&');

  var el = document.createElement('div');
  el.id = 'intro';
  el.innerHTML =
    '<p class="in-top">You are invited</p>' +
    '<div class="env-stage"><div class="env" id="envBtn">' +
      '<div class="env-back"></div>' +
      '<div class="env-card">' +
        '<span class="c-small">Together with their families</span>' +
        '<span class="c-names">' + esc(D.couple) + '</span>' +
        '<span class="c-rule"></span>' +
        '<span class="c-date">' + esc(fmtDate()) + '<br>' + esc(D.venue) + '</span>' +
      '</div>' +
      '<div class="env-l"></div><div class="env-r"></div><div class="env-b"></div>' +
      '<svg class="env-trim" viewBox="0 0 100 69" preserveAspectRatio="none" aria-hidden="true">' +
        '<polyline points="0,69 50,31 100,69" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
        '<polyline points="0,0 52,36 0,69" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
        '<polyline points="100,0 48,36 100,69" fill="none" stroke="rgba(255,255,255,.35)" stroke-width="1" vector-effect="non-scaling-stroke"/>' +
      '</svg>' +
      '<div class="env-flap"></div>' +
      '<button type="button" class="env-seal" aria-label="Open the invitation">' + esc(mono) + '</button>' +
    '</div></div>' +
    '<p class="in-hint">Tap the seal to open</p>';
  document.body.appendChild(el);

  var fast = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var opened = false;

  function sparkle() {
    var stage = el.querySelector('.env-stage');
    var colors = ['#ffffff', '#dfd3c3', '#a8c5db', '#7caad0'];
    for (var i = 0; i < 16; i++) {
      var s = document.createElement('i');
      var a = (Math.PI * 2 * i) / 16 + Math.random() * 0.4;
      var d = 60 + Math.random() * 70;
      s.className = 'spark';
      s.style.background = colors[i % colors.length];
      s.style.setProperty('--dx', Math.round(Math.cos(a) * d) + 'px');
      s.style.setProperty('--dy', Math.round(Math.sin(a) * d - 20) + 'px');
      stage.appendChild(s);
    }
  }

  el.querySelector('#envBtn').addEventListener('click', function() {
    if (opened) return;
    opened = true;
    if (!fast) sparkle();
    el.classList.add('open');
    setTimeout(function() { el.classList.add('leave'); }, fast ? 200 : 2300);
    setTimeout(function() { el.remove(); }, fast ? 400 : 3500);
  });
})();
</script>
